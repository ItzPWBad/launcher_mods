name: Update manifest
on:
  push:
    paths: ['mods/**']
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Regenerate manifest.json
        run: |
          node -e "
            const fs=require('fs'),crypto=require('crypto'),path=require('path');
            const dir='mods';
            const files={};
            for (const f of fs.readdirSync(dir).filter(x=>x.endsWith('.jar'))) {
              const b=fs.readFileSync(path.join(dir,f));
              files[f]=crypto.createHash('md5').update(b).digest('hex');
            }
            const out={
              version:new Date().toISOString().slice(0,10),
              generated:new Date().toISOString(),
              totalMods:Object.keys(files).length,
              files
            };
            fs.writeFileSync('manifest.json',JSON.stringify(out,null,2));
          "
      - name: Commit
        run: |
          git config user.name github-actions
          git config user.email actions@github.com
          git add manifest.json
          git diff --staged --quiet || git commit -m "chore: update manifest.json"
          git push